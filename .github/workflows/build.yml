name: Build APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APK_DIR: ${{ github.workspace }}/apk-out

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          chmod +x gradlew
          mkdir -p "$APK_DIR"
          ./gradlew :TMessagesProj_AppStandalone:assembleStandalone \
            --no-daemon \
            -PapkOutputDir="$APK_DIR" \
            -Pandroid.injected.build.abi=arm64-v8a
          find . -not -path "./apk-out/*" -not -path "./.git/*" -type f -name "*.apk" -exec cp -v {} "$APK_DIR/" \;
          ls -lh "$APK_DIR"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-out
          path: apk-out/*.apk
          if-no-files-found: error

